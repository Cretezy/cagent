[workspace]
members = [
    "crates/cagent-acp",
    "crates/cagent-agent",
    "crates/cagent-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "AGPL-3.0-only"
rust-version = "1.97.1"
version = "0.1.1" # x-release-please-version

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
base64 = "0.22"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
async-trait = "0.1"
brush-parser = "=0.2.20"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = { version = "0.29", features = ["event-stream"] }
directories = "6"
futures-core = "0.3"
futures-util = "0.3"
fs2 = "0.4"
google-cloud-auth = { version = "1", default-features = false }
http = "1"
html2md = "0.2"
ignore = "0.4"
indexmap = { version = "2", features = ["serde"] }
include_dir = "0.7"
image = "0.25.9"
notify = "8"
jsonschema = "0.29"
keyring = "3.6"
pulldown-cmark = "0.13"
portable-pty = "0.9"
rusqlite = { version = "0.37", features = ["bundled"] }
reqwest = { version = "0.13", default-features = false, features = ["form", "json", "rustls", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
rmcp = { version = "=3.1.2", default-features = false, features = ["auth", "client", "reqwest", "transport-child-process", "transport-streamable-http-client-reqwest"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
similar = "2"
simd-json = "0.17.3"
sha2 = "0.10"
sqlparser = "0.61"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "regex-fancy"] }
sublime-syntaxes = "0.2"
tempfile = "3"
thiserror = "2"
time = { version = "0.3", features = ["parsing"] }
tokio = { version = "1", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-stream = "0.1"
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-native-roots"] }
tokio-util = { version = "0.7", features = ["rt"] }
toml = { version = "0.8", features = ["preserve_order"] }
toml_edit = "0.22"
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
trash = "5"
unicode-width = "0.2"
unicode-segmentation = "1"
url = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[workspace.dependencies.nix]
version = "0.30"
features = ["process", "signal", "user"]

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 1
debug = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
