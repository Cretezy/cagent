schema_version = 1
id = "github"
name = "GitHub"
version = "0.3.0"
description = "Connect to GitHub's hosted MCP server for repositories, issues, pull requests, and related workflows."

[parameters.toolsets]
label = "Enabled toolsets"
type = "string_list"
description = "GitHub MCP toolsets exposed to the agent."
default = ["repos", "issues", "pull_requests"]

[secrets.pat]
label = "GitHub personal access token"
type = "string"
description = "Alternatively, create a fine-grained personal access token at https://github.com/settings/personal-access-tokens/new"

[mcp]
transport = "http"
url = "https://api.githubcopilot.com/mcp/"
startup_timeout_seconds = 30
request_timeout_seconds = 60

[mcp.headers]
X-MCP-Toolsets = "${parameter:toolsets}"

[mcp.oauth]
bearer_token = "${secret:pat}"
client_id = "Ov23liqbwZBfNr0IFkh7"
scopes = ["repo", "read:org", "read:user"]
device_authorization_endpoint = "https://github.com/login/device/code"
issuer = "https://github.com/login/oauth"
authorization_endpoint = "https://github.com/login/oauth/authorize"
token_endpoint = "https://github.com/login/oauth/access_token"
