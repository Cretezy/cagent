name: Validate macOS 15 release build

on:
  push:
    branches:
      - "test/macos-15-release-build"

permissions:
  contents: read

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  build:
    name: Build ${{ matrix.target }}
    needs: ci
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin

    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Check package version
        run: |
          python3 scripts/check-release-version.py

      - name: Install Rust target
        run: rustup target add "${{ matrix.target }}"

      - name: Build Cagent
        run: cargo build --release --locked --package cagent-cli --target "${{ matrix.target }}"

      - name: Smoke-test ARM64 binary
        run: |
          file target/aarch64-apple-darwin/release/cagent
          test "$(lipo -archs target/aarch64-apple-darwin/release/cagent)" = arm64
          target/aarch64-apple-darwin/release/cagent --version

      - name: Package binary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p package dist
          cp "target/${{ matrix.target }}/release/cagent" package/cagent
          cp LICENSE README.md package/
          tar -C package -czf "dist/cagent-${{ matrix.target }}.tar.gz" cagent LICENSE README.md

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
