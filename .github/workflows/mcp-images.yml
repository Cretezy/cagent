name: Publish MCP images

on:
  workflow_dispatch:
    inputs:
      package:
        description: MCP package directory name
        required: true
        type: choice
        options:
          - gitlab
        default: gitlab
      version:
        description: Image version tag
        required: true
        default: 0.1.0
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: mcp-image-${{ github.ref }}-${{ inputs.package || 'gitlab' }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
      - uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Select package and version
        id: values
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          echo "package=${INPUT_PACKAGE:-gitlab}" >> "$GITHUB_OUTPUT"
          echo "version=${INPUT_VERSION:-${REF_NAME#v}}" >> "$GITHUB_OUTPUT"
      - name: Build and smoke-test image
        run: bash ./scripts/publish-mcp-image "${{ steps.values.outputs.package }}" --version "${{ steps.values.outputs.version }}"
      - name: Publish image
        run: bash ./scripts/publish-mcp-image "${{ steps.values.outputs.package }}" --push --version "${{ steps.values.outputs.version }}"
